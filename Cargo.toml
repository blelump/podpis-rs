[package]
name = "podpis-rs"
version = "0.2.1"
edition = "2021"
description = "Validate XAdES XML signatures and PAdES PDF signatures (podpis.gov.pl style)"
license = "MIT"
repository = "https://github.com/blelump/podpis-rs"
readme = "README.md"
rust-version = "1.85"
keywords = ["xades", "xml-signature", "xmldsig", "signature", "cryptography"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "podpis-rs"
path = "src/main.rs"

[lib]
name = "podpis_rs"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
rsa = "0.9"
roxmltree = "0.21"
sha1 = "0.11"
sha2 = "0.11"
x509-parser = "0.18"
lopdf = "0.45.0"
cms = "0.2.3"
der = "0.8"
spki = "0.8"
x509-cert = "0.3"
