[package]
name = "podpis-rs"
version = "0.1.1"
edition = "2021"
description = "Validate XAdES-BES enveloping and enveloped XML signatures (podpis.gov.pl style)"
license = "MIT"
repository = "https://github.com/blelump/podpis-rs"
readme = "README.md"
rust-version = "1.85"
keywords = ["xades", "xml-signature", "xmldsig", "signature", "cryptography"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "podpis-rs"
path = "src/main.rs"

[lib]
name = "podpis_rs"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.4"
roxmltree = "0.20"
sha1 = "0.10"
sha2 = "0.10"
x509-parser = "0.16"
